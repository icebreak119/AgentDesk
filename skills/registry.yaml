version: "0.1.0"
description: AgentDesk Skill 注册表（初赛参考实现）

skills:
  session_normalize:
    display_name: SessionNormalize
    version: "0.1"
    entrypoint: session_normalize/v0.1/skill.py
    schema: session_normalize/v0.1/schema.json
    examples:
      - session_normalize/v0.1/examples/douyin_inbound.json
    caller_agents:
      - agent.channel_ingress
    implementation: 统一 SessionEvent 归一与跨渠道去重键生成
    runnable: true

  intent_triage:
    display_name: IntentTriage
    version: "0.1"
    entrypoint: intent_triage/v0.1/skill.py
    schema: intent_triage/v0.1/schema.json
    examples:
      - intent_triage/v0.1/examples/consult.json
      - intent_triage/v0.1/examples/refund.json
    caller_agents:
      - agent.triage_guard
    runnable: true

  reply_plan:
    display_name: ReplyPlan
    version: "0.1"
    entrypoint: reply_plan/v0.1/skill.py
    schema: reply_plan/v0.1/schema.json
    examples:
      - reply_plan/v0.1/examples/consult.json
      - reply_plan/v0.1/examples/high_risk.json
    caller_agents:
      - agent.triage_guard
    runnable: true

  channel_send:
    display_name: ChannelSend
    version: "0.1"
    entrypoint: null
    schema: channel_send/v0.1/schema.json
    contract: docs/contracts/channel.send_message.json
    examples:
      - channel_send/v0.1/examples/send_text.json
    caller_agents:
      - agent.act_verify
    implementation: runtime/douyin HTTP POST /accounts/{code}/send/text
    runnable: false

  outcome_verify:
    display_name: OutcomeVerify
    version: "0.1"
    entrypoint: outcome_verify/v0.1/skill.py
    schema: outcome_verify/v0.1/schema.json
    examples:
      - outcome_verify/v0.1/examples/verify_ok.json
    caller_agents:
      - agent.act_verify
    implementation: 回执与内容一致性校验（Runtime 可注入真实探针）
    runnable: true

  customer_confirm:
    display_name: CustomerConfirm
    version: "0.1"
    entrypoint: customer_confirm/v0.1/skill.py
    schema: customer_confirm/v0.1/schema.json
    examples:
      - customer_confirm/v0.1/examples/confirmed.json
    caller_agents:
      - agent.act_verify
    implementation: 客户反馈确认、待跟进与升级判定
    runnable: true

  case_digest:
    display_name: CaseDigest
    version: "0.1"
    entrypoint: case_digest/v0.1/skill.py
    schema: case_digest/v0.1/schema.json
    examples:
      - case_digest/v0.1/examples/confirmed_consult.json
    caller_agents:
      - agent.case_learning
    implementation: 脱敏案例复盘、标签化归档与历史案例检索
    runnable: true

  business_action:
    display_name: BusinessAction
    version: "0.1"
    entrypoint: business_action/v0.1/skill.py
    schema: business_action/v0.1/schema.json
    examples:
      - business_action/v0.1/examples/refund.json
    caller_agents:
      - agent.act_verify
    implementation: 企业退款动作请求校验；可切换独立 HTTP 企业业务模拟器或 JSONL 离线适配器
    runnable: true
